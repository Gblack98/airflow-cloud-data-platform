name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install "apache-airflow==2.10.5" apache-airflow-providers-cncf-kubernetes --constraint \
            "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt"
          pip install pytest
      - name: Test
        run: pytest -v
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
